<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
}

.container{
    width:350px;
    margin:100px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    background:blue;
    color:white;
    border:none;
    cursor:pointer;
}

a{
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">
    <h2>Login</h2>

    <form action="/login" method="post">

        <input type="email" name="email" placeholder="Enter Email" required>

        <input type="password" name="pass" placeholder="Enter Password" required>

        <button type="submit">Login</button>

    </form>

    <p align="center">
        New User?
        <a href="/register">Register</a>
    </p>
</div>

</body>
</html>
